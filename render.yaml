# Render.com 用ブループリント。
# 使い方: Renderのダッシュボードで「New +」→「Blueprint」→ このリポジトリを選択。
#
# データ(登録ユーザー・クライアント企業情報)を永続化するため、
# plan は starter（有料・永続ディスク対応）にし、disks 設定を有効化しています。
# 無料プランに戻したい場合は plan を free にし、下の disks 設定をコメントアウトしてください
# （ただしその場合、再起動・再デプロイのたびにデータが消えます）。
services:
  - type: web
    name: keiei-shihyo-app
    env: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/app.sqlite
    disks:
      - name: data
        mountPath: /var/data
        sizeGB: 1
