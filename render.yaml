# Render.com 用ブループラート。
# 使い方: Renderのダッシュボードで「New +」→「Blueprint」→ このリポジトリを選択。
#
# 注意: 無料プラン(free)には永続ディスクを付けられないため、サービスの
# 再起動・再デプロイのたびに data/app.sqlite の中身（登録したユーザーや
# クライアント企業のデータ）が消えます。動作確認だけなら free のままで
# 構いませんが、実際にクライアントのデータを預かって運用する場合は
# plan を starter 以上に上げ、disks 設定を有効化してください。
services:
  - type: web
    name: keiei-shihyo-app
    env: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/app.sqlite
    # 永続ディスクを使う場合は plan を starter 以上にした上で、
    # 以下のコメントを外してください（無料プランではエラーになります）。
    # disks:
    #   - name: data
    #     mountPath: /var/data
    #     sizeGB: 1
